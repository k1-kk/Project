<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆瓣 Top 250 榜单</title>
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    <header>
        <h1>豆瓣 Top 250 电影数据</h1>
        <p>Python 爬虫 + FastAPI + JavaScript 前端展示</p>  
    </header>

    <section class="controls">
        <input id="min-rating" type="number" min="0" max="10" step="0.1" placeholder="最低评分">
        <input id="max-rating" type="number" min="0" max="10" step="0.1" placeholder="最高评分">
        <input id="limit" type="number" min="1" max="250" step="1" placeholder="筛选个数">
        <button id="loadBtn">查询电影</button>
    </section>

    <p id="status"></p>

    <section id="movieGrid" class="movie-grid"></section>
    <script src="./app.js"></script>
</body>
</html>
